<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador do Grafo - Algoritmo de Dijkstra</title>
    <link rel="stylesheet" href="style_options.css">
</head>
<body>

    <header>
        <h1>Calculador de Menor Rota - Dijkstra</h1>
    </header>

    <div class="container">
        <!-- Painel de Controle -->
        <div class="sidebar">
            <div class="form-group">
                <label for="origem">Ponto de Partida (Origem):</label>
                <select id="origem"></select>
            </div>

            <div class="form-group">
                <label for="destino">Ponto de Chegada (Destino):</label>
                <select id="destino"></select>
            </div>

            <button id="btnCalcular">Calcular Rota</button>

            <div class="result-card">
                <span class="title">Distância Mínima:</span>
                <span id="resDistancia" class="value">-</span>
            </div>

            <div class="result-card">
                <span class="title">Rota Recomendada:</span>
                <span id="resCaminho" class="path">-</span>
            </div>
        </div>

        <!-- Área do Grafo Interativo -->
        <div class="graph-wrapper">
            <svg id="grafoSvg" viewBox="0 0 900 600"></svg>
        </div>
    </div>

    <script>
        // Grafo proveniente do script Python
        const grafo = {
            "RS": {"TA": 7, "RO": 5, "TC": 4, "LO": 2, "PG": 6, "PR": 9, "IB": 5, "IT": 8},
            "TA": {"LA": 4, "SA": 5, "AG": 9, "RS": 7, "PR": 12},
            "LA": {"TA": 4, "RO": 3},
            "SA": {"TA": 5, "TC": 6},
            "RO": {"LA": 3, "AG": 4, "RS": 5, "IT": 14},
            "TC": {"SA": 6, "RS": 4, "LO": 3, "IT": 11},
            "AG": {"TA": 9, "RO": 4, "WI": 6, "IB": 10},
            "LO": {"TC": 3, "RS": 2, "PG": 4, "IB": 8},
            "PG": {"LO": 4, "RS": 6, "VR": 3, "PR": 13, "IB": 7},
            "WI": {"AG": 6, "AU": 2, "PR": 5, "IB": 6},
            "AU": {"WI": 2, "PR": 3, "IT": 9},
            "VR": {"PG": 3, "IT": 4},
            "PR": {"TA": 12, "RS": 9, "WI": 5, "AU": 3, "PG": 13},
            "IB": {"RS": 5, "AG": 10, "LO": 8, "PG": 7, "WI": 6, "IT": 2},
            "IT": {"RS": 8, "RO": 14, "TC": 11, "VR": 4, "AU": 9, "IB": 2}
        };

        // Coordenadas visuais (X, Y) para desenhar os nós em tela
        const posicoes = {
            "RS": {x: 450, y: 300},
            "TA": {x: 220, y: 220},
            "LA": {x: 160, y: 340},
            "SA": {x: 140, y: 140},
            "RO": {x: 290, y: 350},
            "TC": {x: 320, y: 190},
            "AG": {x: 230, y: 470},
            "LO": {x: 580, y: 200},
            "PG": {x: 600, y: 350},
            "WI": {x: 370, y: 530},
            "AU": {x: 510, y: 540},
            "VR": {x: 750, y: 430},
            "PR": {x: 720, y: 240},
            "IB": {x: 620, y: 130},
            "IT": {x: 480, y: 430}
        };

        // Algoritmo de Dijkstra equivalente ao do Python
        function dijkstra(grafo, inicio, fim) {
            if (!(inicio in grafo) || !(fim in grafo)) return { distancia: null, caminho: [] };

            let distancias = {};
            let anteriores = {};
            let naoVisitados = new Set(Object.keys(grafo));

            for (let vertice in grafo) {
                distancias[vertice] = Infinity;
                anteriores[vertice] = null;
            }
            distancias[inicio] = 0;

            while (naoVisitados.size > 0) {
                let verticeAtual = null;
                for (let vertice of naoVisitados) {
                    if (verticeAtual === null || distancias[vertice] < distancias[verticeAtual]) {
                        verticeAtual = vertice;
                    }
                }

                if (distancias[verticeAtual] === Infinity || verticeAtual === fim) break;

                naoVisitados.delete(verticeAtual);

                for (let vizinho in grafo[verticeAtual]) {
                    let peso = grafo[verticeAtual][vizinho];
                    let distanciaNova = distancias[verticeAtual] + peso;

                    if (distanciaNova < distancias[vizinho]) {
                        distancias[vizinho] = distanciaNova;
                        anteriores[vizinho] = verticeAtual;
                    }
                }
            }

            let caminho = [];
            let atual = fim;
            while (atual !== null) {
                caminho.unshift(atual);
                atual = anteriores[atual];
            }

            if (distancias[fim] === Infinity) return { distancia: Infinity, caminho: [] };
            return { distancia: distancias[fim], caminho: caminho };
        }

        // Renderização Visual do Grafo
        const svg = document.getElementById('grafoSvg');
        const selectOrigem = document.getElementById('origem');
        const selectDestino = document.getElementById('destino');

        function inicializarInterface() {
            // Preencher Selects
            const nos = Object.keys(grafo);
            nos.forEach(no => {
                selectOrigem.add(new Option(no, no));
                selectDestino.add(new Option(no, no));
            });
            selectOrigem.value = "RS";
            selectDestino.value = "VR";

            desenharGrafo();
            executarDijkstra();
        }

        function desenharGrafo() {
            svg.innerHTML = '';
            const arestasProcessadas = new Set();

            // Desenhar Arestas (Linhas e Pesos)
            for (let u in grafo) {
                for (let v in grafo[u]) {
                    const chaveAresta = [u, v].sort().join('-');
                    if (!arestasProcessadas.has(chaveAresta)) {
                        arestasProcessadas.add(chaveAresta);

                        const p1 = posicoes[u];
                        const p2 = posicoes[v];
                        const peso = grafo[u][v];

                        // Linha da Aresta
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', p1.x);
                        line.setAttribute('y1', p1.y);
                        line.setAttribute('x2', p2.x);
                        line.setAttribute('y2', p2.y);
                        line.setAttribute('class', 'edge');
                        line.setAttribute('id', `edge-${chaveAresta}`);
                        svg.appendChild(line);

                        // Rótulo do Peso
                        const midX = (p1.x + p2.x) / 2;
                        const midY = (p1.y + p2.y) / 2;

                        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        rect.setAttribute('x', midX - 10);
                        rect.setAttribute('y', midY - 8);
                        rect.setAttribute('width', 20);
                        rect.setAttribute('height', 16);
                        rect.setAttribute('class', 'edge-label-bg');
                        svg.appendChild(rect);

                        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        text.setAttribute('x', midX);
                        text.setAttribute('y', midY);
                        text.setAttribute('class', 'edge-label');
                        text.textContent = peso;
                        svg.appendChild(text);
                    }
                }
            }

            // Desenhar Nós (Vértices)
            for (let no in posicoes) {
                const pos = posicoes[no];

                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('class', 'node');
                g.setAttribute('id', `node-${no}`);
                g.onclick = () => selecionarNoClique(no);

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', pos.x);
                circle.setAttribute('cy', pos.y);
                circle.setAttribute('r', 18);

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', pos.x);
                text.setAttribute('y', pos.y);
                text.textContent = no;

                g.appendChild(circle);
                g.appendChild(text);
                svg.appendChild(g);
            }
        }

        function executarDijkstra() {
            const inicio = selectOrigem.value;
            const fim = selectDestino.value;

            // Limpar destaques anteriores
            document.querySelectorAll('.edge').forEach(el => el.classList.remove('highlighted'));
            document.querySelectorAll('.node').forEach(el => el.classList.remove('selected', 'in-path'));

            const { distancia, caminho } = dijkstra(grafo, inicio, fim);

            const resDistancia = document.getElementById('resDistancia');
            const resCaminho = document.getElementById('resCaminho');

            if (distancia === null || distancia === Infinity) {
                resDistancia.textContent = "Sem rota";
                resCaminho.textContent = "Nenhum caminho disponível";
                return;
            }

            resDistancia.textContent = distancia;
            resCaminho.textContent = caminho.join(' ➔ ');

            // Destacar Nós do Caminho
            caminho.forEach(no => {
                const nodeEl = document.getElementById(`node-${no}`);
                if (nodeEl) nodeEl.classList.add('in-path');
            });

            document.getElementById(`node-${inicio}`)?.classList.add('selected');
            document.getElementById(`node-${fim}`)?.classList.add('selected');

            // Destacar Arestas do Caminho
            for (let i = 0; i < caminho.length - 1; i++) {
                const u = caminho[i];
                const v = caminho[i + 1];
                const chaveAresta = [u, v].sort().join('-');
                const edgeEl = document.getElementById(`edge-${chaveAresta}`);
                if (edgeEl) edgeEl.classList.add('highlighted');
            }
        }

        function selecionarNoClique(no) {
            if (selectOrigem.value === no) return;
            selectDestino.value = no;
            executarDijkstra();
        }

        document.getElementById('btnCalcular').addEventListener('click', executarDijkstra);
        selectOrigem.addEventListener('change', executarDijkstra);
        selectDestino.addEventListener('change', executarDijkstra);

        window.onload = inicializarInterface;
    </script>
</body>
</html>
